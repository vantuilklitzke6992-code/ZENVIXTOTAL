{% extends "base.html" %}

{% block content %}
<section class="form-card">
    <h1>Solicitar serviço</h1>
    <p>Você está solicitando um serviço para <strong>{{ provider['nome'] }}</strong>{% if provider['empresa_nome'] %}
        ({{ provider['empresa_nome'] }}){% endif %}.</p>
    <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="categoria">Categoria do serviço</label>
            <input id="categoria" name="categoria" type="text" required>
        </div>
        <div class="form-group">
            <label for="descricao">Descrição do serviço</label>
            <textarea id="descricao" name="descricao" rows="5" required></textarea>
        </div>
        <div class="form-group">
            <label for="valor">Valor estimado</label>
            <input id="valor" name="valor" type="text" placeholder="Opcional">
        </div>
        <div class="form-actions">
            <button type="submit" class="button button-primary">Enviar solicitação</button>
            <a href="/profissionais" class="button button-secondary">Voltar</a>
        </div>
    </form>
</section>
{% endblock %}
