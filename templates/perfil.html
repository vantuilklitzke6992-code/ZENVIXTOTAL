{% extends "base.html" %}

{% block content %}
<section class="form-card">
    <h1>Meu perfil</h1>
    <form method="post">
        <div class="form-group">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" value="{{ user['nome'] }}" required>
        </div>
        <div class="form-group">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" value="{{ user['email'] }}" readonly>
        </div>
        <div class="form-group">
            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="text" value="{{ user['telefone'] or '' }}">
        </div>
        <div class="form-group">
            <label for="cidade">Cidade</label>
            <input id="cidade" name="cidade" type="text" value="{{ user['cidade'] or '' }}">
        </div>
        <div class="form-group">
            <label for="bio">Descrição do perfil</label>
            <textarea id="bio" name="bio" rows="4">{{ user['bio'] or '' }}</textarea>
        </div>
        {% if user['tipo'] == 'profissional' %}
        <div class="form-group">
            <label for="especialidade">Especialidade</label>
            <input id="especialidade" name="especialidade" type="text" value="{{ user['especialidade'] or '' }}">
        </div>
        {% elif user['tipo'] == 'empresa' %}
        <div class="form-group">
            <label for="empresa_nome">Nome da empresa</label>
            <input id="empresa_nome" name="empresa_nome" type="text" value="{{ user['empresa_nome'] or '' }}">
        </div>
        {% endif %}
        <div class="form-group">
            <label>Tipo de usuário</label>
            <p>{{ user['tipo']|capitalize }}</p>
        </div>
        <div class="form-actions">
            <button type="submit" class="button button-primary">Atualizar perfil</button>
            <a href="/dashboard" class="button button-secondary">Voltar ao painel</a>
        </div>
    </form>
</section>
{% endblock %}
