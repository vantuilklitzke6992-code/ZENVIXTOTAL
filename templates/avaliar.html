{% extends "base.html" %}

{% block content %}
<section class="form-card">
    <h1>Avaliar serviço</h1>
    <p>Serviço com <strong>{{ service.profissional_nome }}</strong></p>
    <p>Descrição: {{ service.descricao }}</p>

    <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="nota">Nota</label>
            <select id="nota" name="nota" required>
                <option value="">Selecione</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </div>
        <div class="form-group">
            <label for="comentario">Comentário</label>
            <textarea id="comentario" name="comentario" rows="5"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="button button-primary">Enviar avaliação</button>
            <a href="/meus-servicos" class="button button-secondary">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
